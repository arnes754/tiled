[project]
name = "tilevis-perception"
version = "0.1.0"
description = "Model wrappers: segmentation and depth, disk-cached per photo."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-contrib-python>=4.10",
    "torch>=2.4",
    "transformers>=4.45",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
